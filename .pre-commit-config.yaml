repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0          # run `uvx pre-commit autoupdate` to bump
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]   # dbt YAML uses Jinja the strict parser rejects
      - id: check-added-large-files
        args: ['--maxkb=10800']

  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff lint
        exclude: '(^|/)metric_view_[^/]*\.sql$'
        entry: uv run --project marketing_platform sqlfluff lint
        language: system
        types: [sql]
