marketing_platform:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"

  meta:
    base: &base
      type: databricks
      threads: 8
      connect_retries: 3
      connect_timeout: 600
    base_auth: &base_auth
      type: databricks
      auth_type: oauth
      client_id: "{{ env_var('DBX_ID_APPLICATION_ID') }}"
      client_secret: "{{ env_var('DBX_SECRET') }}"
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      threads: 8
      connect_retries: 3
      connect_timeout: 600
      retry_all: true

  outputs:
    dev:
      <<: *base
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DEV_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_PAT_TOKEN') }}"
      catalog: "{{ env_var('DEV_CATALOG') }}"
      schema: "{{ env_var('DEV_SCHEMA') }}"

    ci:
      <<: *base_auth
      catalog: ci_development
      schema: "{{ env_var('DEV_SCHEMA') }}"        # PR_<branch>, set by the workflow

    staging: &staging_service_account
      <<: *base_auth
      catalog: silver_staging
      schema: analytics

    production: &production_service_account
      <<: *base_auth
      catalog: silver_production
      schema: analytics

elementary:
  outputs:
    production:
      <<: *production_service_account
      schema: elementary
    staging:
      <<: *staging_service_account
      schema: elementary
